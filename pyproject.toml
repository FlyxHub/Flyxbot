[project]
name = "flyxbot"
version = "0.2.0"
description = "A single-guild Discord bot."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.7,<3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.6"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "ASYNC",# blocking calls in async code
    "SIM",  # simplifications
    "RUF",
]
